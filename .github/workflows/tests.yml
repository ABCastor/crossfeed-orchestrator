name: tests

# The whole suite, on Linux and macOS: the wrappers depend on each platform's bash, sed, ps and
# jq, so a change that only works on one of them fails here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Tools the suites use
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y jq zip unzip
          else command -v jq || brew install jq; fi
      - name: Validate the example overlay
        run: bash scripts/roster.sh validate
        env:
          ACCESS_OVERLAY: ${{ github.workspace }}/examples/access-overlay.example.json
      - name: Every suite
        run: bash tests/run-all.sh
