<svg xmlns="http://www.w3.org/2000/svg" width="112" height="72" viewBox="0 -27 54 34.714" role="img" aria-label="Crossfeed Orchestrator logo"><title>Crossfeed Orchestrator logo</title><style>:root{--i:#14130f;--p:#ffffff;--t:#f1dfd4;--h:#c4552a;--paper:#ffffff;--ink:#14130f;}@media(prefers-color-scheme:dark){:root{--i:#e9e6df;--p:#0d1117;--t:#301e15;--paper:#0d1117;--ink:#e9e6df;}}.cf-bar,.cf-badge{transform-box:view-box;transform-origin:0 0;animation:cf-valve 8s linear infinite}.cf-flow{animation:cf-pipe 8s linear infinite}.cf-l{animation:cf-left 8s linear infinite}.cf-r{animation:cf-right 8s linear infinite}
@keyframes cf-valve{
  0%,5%{transform:rotate(0deg)}10%,40%{transform:rotate(90deg)}
  45%,100%{transform:rotate(0deg)}
}
@keyframes cf-pipe{
  0%,10%{stroke-dashoffset:1;opacity:1}20%,44.99%{stroke-dashoffset:0;opacity:1}
  45%{stroke-dashoffset:0;opacity:0}45.01%,100%{stroke-dashoffset:1;opacity:0}
}
@keyframes cf-left{
  0%,20%{transform:translateY(0px)}35%,55%{transform:translateY(7px)}
  80%,100%{transform:translateY(0px)}
}
@keyframes cf-right{
  0%,20%{transform:translateY(0px)}35%,55%{transform:translateY(-7px)}
  80%,100%{transform:translateY(0px)}
}
